services:
  - type: web
    name: ai-secure-rag-keycloak-staging
    runtime: docker
    rootDir: keycloak
    plan: free
    healthCheckPath: /realms/rag-engine/.well-known/openid-configuration
    autoDeployTrigger: commit
    envVars:
      - key: PORT
        value: 8080
      - key: KC_HTTP_PORT
        value: 8080
      - key: KC_DB
        value: postgres
      - key: KC_DB_URL
        sync: false
      - key: KC_DB_USERNAME
        sync: false
      - key: KC_DB_PASSWORD
        sync: false
      - key: KC_BOOTSTRAP_ADMIN_USERNAME
        sync: false
      - key: KC_BOOTSTRAP_ADMIN_PASSWORD
        sync: false
      - key: KC_CLIENT_SECRET
        sync: false
