name: ai_secure_rag_engine_monitoring

services:

  tempo:
    image: grafana/tempo:2.6.1
    container_name: ai_secure_rag_tempo
    restart: unless-stopped
    user: "0:0"
    command: ["-config.file=/etc/tempo/tempo.yml"]
    volumes:
      - ./monitoring/tempo/tempo.yml:/etc/tempo/tempo.yml:ro
      - tempo_data:/tmp/tempo
    ports:
      - "3200:3200"
    networks:
      - monitoring-network

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.106.1
    container_name: ai_secure_rag_otel_collector
    restart: unless-stopped
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    volumes:
      - ./monitoring/otel/otel-collector-config.yml:/etc/otelcol-contrib/config.yaml:ro
    ports:
      - "4317:4317"
      - "4318:4318"
      - "13133:13133"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - tempo
    networks:
      - monitoring-network

  alert-webhook:
    image: mendhak/http-https-echo:31
    container_name: ai_secure_rag_alert_webhook
    restart: unless-stopped
    environment:
      HTTP_PORT: 8080
    ports:
      - "18080:8080"
    networks:
      - monitoring-network

  alertmanager:
    image: prom/alertmanager:v0.27.0
    container_name: ai_secure_rag_alertmanager
    restart: unless-stopped
    command:
      - "--config.file=/etc/alertmanager/alertmanager.yml"
      - "--storage.path=/alertmanager"
    volumes:
      - ./monitoring/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager_data:/alertmanager
    ports:
      - "9093:9093"
    depends_on:
      - alert-webhook
    networks:
      - monitoring-network

  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: ai_secure_rag_prometheus
    restart: unless-stopped
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.enable-lifecycle"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/prometheus/rules:/etc/prometheus/rules:ro
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    depends_on:
      - otel-collector
      - alertmanager
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - monitoring-network

  grafana:
    image: grafana/grafana:11.1.4
    container_name: ai_secure_rag_grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_FEATURE_TOGGLES_ENABLE: traceqlEditor
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
      - tempo
      - alertmanager
    networks:
      - monitoring-network

volumes:
  prometheus_data:
  grafana_data:
  tempo_data:
  alertmanager_data:

networks:
  monitoring-network:
    driver: bridge
