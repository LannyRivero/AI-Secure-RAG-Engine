# Production profile
# All sensitive values MUST be provided via environment variables.
# The application will fail fast on startup if any required variable is missing.
#
# Required environment variables:
#   DB_URL        — JDBC URL            e.g. jdbc:postgresql://db-host:5432/rag_engine
#   DB_USERNAME   — Database user
#   DB_PASSWORD   — Database password
#   REDIS_HOST    — Redis host          e.g. redis
#   OPENAI_API_KEY — OpenAI API key     (defined in application.yaml, must be set)
#   APP_SECURITY_PUBLIC_PROMETHEUS_ENABLED — expose /actuator/prometheus without auth (default false)

spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 2s
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI}

logging:
  level:
    root: WARN
    com.lanny.ailab: INFO

app:
  swagger:
    enabled: false
  security:
    public-prometheus:
      enabled: ${APP_SECURITY_PUBLIC_PROMETHEUS_ENABLED:false}
  rag:
    rate-limit:
      backend: redis
