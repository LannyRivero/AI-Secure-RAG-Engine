server:
  port: ${PORT:8080}

spring:
  application:
    name: ai-secure-rag-engine
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8180/realms/rag-engine}

  ai:
    openai:
      api-key: ${OPENAI_API_KEY}
      chat:
        options:
          model: gpt-4o-mini
          temperature: 0.0
      connection-timeout: 5s
      read-timeout: 10s

app:
  swagger:
    enabled: false
  security:
    public-prometheus:
      enabled: false
  llm:
    provider: openai   # stub | openai

  rag:
    retriever: hybrid  # vector | hybrid
    min-score-threshold: 0.70
    default-top-k: 3
    max-top-k: 20
    rate-limit:
      backend: in-memory  # in-memory | redis
      redis:
        key-prefix: ai-secure-rag-engine:rate-limit
      query-requests-per-minute: 20
      ingest-requests-per-minute: 10

management:
  endpoints:
    web:
      exposure:
        include: health, prometheus
  endpoint:
    health:
      show-details: when-authorized
  metrics:
    tags:
      application: ${spring.application.name}
  tracing:
    enabled: true
    sampling:
      probability: ${MANAGEMENT_TRACING_SAMPLING_PROBABILITY:1.0}
    export:
      enabled: ${MANAGEMENT_TRACING_EXPORT_ENABLED:false}
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: ${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:http://localhost:4318/v1/traces}

resilience4j:
  retry:
    instances:
      llmRetry:
        max-attempts: 3
        wait-duration: 500ms
        exponential-backoff-multiplier: 2
        retry-exceptions:
          - com.lanny.ailab.rag.domain.exception.LlmProviderException

  circuitbreaker:
    instances:
      llmCircuitBreaker:
        sliding-window-type: COUNT_BASED
        sliding-window-size: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 30s
        permitted-number-of-calls-in-half-open-state: 3
        register-health-indicator: true

  timelimiter:
    instances:
      llmTimeout:
        timeout-duration: 15s
        cancel-running-future: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    oauth2-redirect-url: /swagger-ui/oauth2-redirect.html
    oauth:
      client-id: rag-engine
      client-secret: ${KC_CLIENT_SECRET:rag-engine-secret-dev}
  api-docs:
    path: /v3/api-docs

logging:
  include-application-name: false
  pattern:
    correlation: "[${spring.application.name:},%X{traceId:-},%X{spanId:-}] "
    console: "%d{HH:mm:ss.SSS} [%thread] ${logging.pattern.correlation}[%X{queryId:-}] [%X{tenantId:-}] %-5level %logger{36} - %msg%n"
