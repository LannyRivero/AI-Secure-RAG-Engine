spring:
  datasource:
    url: jdbc:postgresql://localhost:5433/${POSTGRES_DB:ai_lab}
    username: ${POSTGRES_USER:postgres}
    password: ${POSTGRES_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 2s

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false

  logging:
  level:
    root: INFO
    com.lanny.ailab: DEBUG
    org.springframework.security: DEBUG

app:
  rag:
    rate-limit:
      backend: redis
