global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/rules/*.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093

scrape_configs:
  - job_name: ai-secure-rag-engine
    metrics_path: /actuator/prometheus
    static_configs:
      - targets:
          - host.docker.internal:8080

  - job_name: otel-collector
    static_configs:
      - targets:
          - otel-collector:8888

  - job_name: tempo
    static_configs:
      - targets:
          - tempo:3200

  - job_name: alertmanager
    static_configs:
      - targets:
          - alertmanager:9093
