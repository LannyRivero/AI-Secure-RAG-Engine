groups:
  - name: ai-secure-rag-engine.slo
    rules:
      - alert: RagQuerySuccessRateLow
        expr: |
          100 * (
            1 - (
              sum(rate(rag_operation_requests_total{operation="query",outcome="error"}[15m]))
              /
              clamp_min(sum(rate(rag_operation_requests_total{operation="query"}[15m])), 0.001)
            )
          ) < 99
        for: 15m
        labels:
          severity: critical
          service: ai-secure-rag-engine
          slo: query-success-rate
        annotations:
          summary: Query success rate is below 99%
          description: Query operation success rate stayed below 99% for 15 minutes.

      - alert: RagQueryLatencyP95High
        expr: |
          histogram_quantile(
            0.95,
            sum by (le) (rate(rag_operation_latency_seconds_bucket{operation="query"}[15m]))
          ) > 2.5
        for: 15m
        labels:
          severity: warning
          service: ai-secure-rag-engine
          slo: query-latency
        annotations:
          summary: Query p95 latency is above 2.5 seconds
          description: Query operation p95 latency exceeded 2.5s for 15 minutes.

      - alert: RagProviderErrorRateHigh
        expr: |
          100 * (
            sum(rate(rag_provider_calls_total{outcome="error"}[15m])) by (provider, operation)
            /
            clamp_min(sum(rate(rag_provider_calls_total[15m])) by (provider, operation), 0.001)
          ) > 1
        for: 15m
        labels:
          severity: warning
          service: ai-secure-rag-engine
          slo: provider-error-rate
        annotations:
          summary: Provider error rate is above 1%
          description: Provider {{ $labels.provider }} operation {{ $labels.operation }} exceeded 1% errors for 15 minutes.

      - alert: RagIngestionBacklogHigh
        expr: rag_ingestion_queued > 50
        for: 15m
        labels:
          severity: warning
          service: ai-secure-rag-engine
          slo: ingestion-backlog
        annotations:
          summary: Ingestion backlog is growing
          description: The queued ingestion backlog has stayed above 50 jobs for 15 minutes.

      - alert: RagDeadLetterQueueNonZero
        expr: rag_ingestion_dead_letter_queue > 0
        for: 5m
        labels:
          severity: critical
          service: ai-secure-rag-engine
          slo: ingestion-dlq
        annotations:
          summary: Dead-letter ingestion jobs detected
          description: At least one ingestion job entered the dead-letter queue and requires investigation.

      - alert: RagRateLimitBackendUnavailable
        expr: sum(rate(rag_rate_limit_backend_unavailable_total[15m])) > 0
        for: 10m
        labels:
          severity: warning
          service: ai-secure-rag-engine
          slo: rate-limit-backend
        annotations:
          summary: Rate limit backend is unavailable
          description: The Redis-backed rate limiting backend has reported availability issues for 10 minutes.
