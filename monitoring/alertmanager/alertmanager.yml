global:
  resolve_timeout: 5m

route:
  receiver: default-webhook
  group_by: [alertname, service, severity]
  group_wait: 10s
  group_interval: 30s
  repeat_interval: 2h
  routes:
    - matchers:
        - severity = critical
      receiver: critical-webhook

receivers:
  - name: default-webhook
    webhook_configs:
      - url: http://alert-webhook:8080/alerts/warning
        send_resolved: true

  - name: critical-webhook
    webhook_configs:
      - url: http://alert-webhook:8080/alerts/critical
        send_resolved: true
